---
layout: default
---
{% comment %}
	Shared template for all project pages in projects/<Name>/index.html.
	Each project page only contains YAML front matter.
	Optional fields: award, author_note, teaser_width, links, videos. teaser can be a single
	image or a list. videos entries are .mp4 files (shown with <video>) or embed URLs
	such as https://www.youtube.com/embed/<id> (shown with <iframe>).
	Relative file paths are relative to the project directory.
	Styles are in css/main.css.
{% endcomment %}

<header class="project-header">
	<h1 class="project-title">{{ page.title }}</h1>
	<div class="project-venue">{{ page.venue }}</div>
	{% if page.award %}<div class="award">{{ page.award }}</div>{% endif %}

	<ul class="project-authors">
		{% for author in page.authors %}
		{% assign author_parts = author | split: " (" %}
		<li>{{ author_parts[0] }}{% if author_parts[1] %}<sup>{{ author_parts[1] | remove: ")" | remove: " " }}</sup>{% endif %}</li>
		{% endfor %}
	</ul>
	<ul class="project-affiliations">
		{% for affiliation in page.affiliations %}
		<li>{% if page.affiliations.size > 1 %}<sup>{{ forloop.index }}</sup>{% endif %}{{ affiliation }}</li>
		{% endfor %}
	</ul>
	{% if page.author_note %}<div class="author-note">{{ page.author_note }}</div>{% endif %}

	<div class="project-links">
		<span class="link-group"><span class="link-label">Paper</span><a class="pill" href="{{ page.paper }}">PDF</a></span>
		{% for group in page.links %}
		<span class="link-group"><span class="link-label">{{ group[0] }}</span>{% for link in group[1] %}<a class="pill" href="{{ link[1] }}">{{ link[0] }}</a>{% endfor %}</span>
		{% endfor %}
	</div>
</header>

{% assign teaser_width = page.teaser_width | default: "100%" %}
{% if page.teaser.first %}{% assign teasers = page.teaser %}{% else %}{% assign teasers = page.teaser | split: "|" %}{% endif %}
<figure class="teaser">
	{% for teaser in teasers %}<img src="{{ teaser }}" style="width: {{ teaser_width }};" alt="{{ page.title }}">{% endfor %}
</figure>

<section class="project-section">
	<h2>Abstract</h2>
	<p class="abstract">{{ page.abstract }}</p>
</section>

{% if page.videos %}
<section class="project-section">
	<h2>Video{% if page.videos.size > 1 %}s{% endif %}</h2>
	{% for video in page.videos %}
	{% assign ext = video | split: "." | last | downcase %}
	<div class="video">
		{% if ext == "mp4" %}
		<video controls preload="metadata"><source src="{{ video }}" type="video/mp4"></video>
		{% else %}
		<iframe src="{{ video }}" title="{{ page.title }}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
		{% endif %}
	</div>
	{% endfor %}
</section>
{% endif %}

<section class="project-section">
	<h2>BibTeX</h2>
	<pre class="bibtex">{{ page.bibtex }}</pre>
</section>
